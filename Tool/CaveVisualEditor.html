<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 本地管理器 (高性能大图版)</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --gap: 16px;
        }

        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; overflow-y: scroll; }

        /* 顶部悬浮栏 */
        .header-sticky {
            position: sticky; top: 0; z-index: 100;
            background: rgba(240, 242, 245, 0.95);
            padding: 12px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
        }
        .controls-main { display: flex; gap: 10px; flex-grow: 1; }
        .status { font-size: 13px; color: var(--text-muted); }

        /* 按钮基础样式 */
        button { 
            padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer;
            font-size: 14px; background: var(--accent); color: white; font-weight: 500;
        }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        button.danger { background: var(--danger); }
        button.secondary { background: #4b5563; }
        button.success { background: var(--success); }

        /* 网格容器 */
        .container { padding: 20px; max-width: 100%; margin: 0 auto; }
        #card-grid { display: flex; flex-wrap: wrap; gap: var(--gap); }

        /* 卡片样式 */
        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 8px; width: calc((100% - 5 * var(--gap)) / 6);
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* 响应式列数 */
        @media (max-width: 1600px) { .card { width: calc((100% - 4 * var(--gap)) / 5); } }
        @media (max-width: 1200px) { .card { width: calc((100% - 3 * var(--gap)) / 4); } }
        @media (max-width: 800px) { .card { width: calc((100% - 1 * var(--gap)) / 2); } }

        /* 只有顶部 Header 支持点击选择 */
        .card-header {
            padding: 10px; font-size: 12px; color: var(--text-muted);
            border-bottom: 1px solid var(--border); cursor: pointer;
            background: #fafafa; position: relative;
        }
        .card-header:hover { background: #f0f0f0; }
        .card.selected { border: 2px solid var(--accent); margin: -1px; }
        .card.selected .card-header { background: rgba(59, 130, 246, 0.1); }
        .card.selected::after {
            content: '✔'; position: absolute; top: 5px; right: 8px;
            color: var(--accent); font-weight: bold; font-size: 16px;
        }

        .card-content { padding: 10px; flex-grow: 1; }
        .card-content img {
            width: 100%; border-radius: 4px; border: 1px solid var(--border);
            cursor: zoom-in; display: block; margin-bottom: 8px;
        }
        .text-node { font-size: 13px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 8px; }
        .forward-box { border-left: 2px solid #ccc; padding-left: 8px; margin-top: 8px; font-size: 12px; color: #555; }

        /* 大图查看层 (Lightbox) */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000;
            display: none; align-items: center; justify-content: center;
            cursor: zoom-out;
        }
        #lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; border: 2px solid #333; }
    </style>
</head>
<body>

<div class="header-sticky">
    <div class="controls-main">
        <button id="btn-open">1. 打开文件夹</button>
        <button id="btn-all" class="secondary" disabled>全选</button>
        <button id="btn-none" class="secondary" disabled>反选</button>
        <button id="btn-del" class="danger" disabled>2. 删除选中</button>
        <button id="btn-save" class="success" disabled>3. 保存更改</button>
    </div>
    <div id="status-text" class="status">等待载入...</div>
</div>

<div class="container">
    <div id="card-grid"></div>
</div>

<div id="lightbox"><img src="" id="lightbox-img"></div>

<script>
    let allData = [];
    let imgMap = new Map();
    let selectedIds = new Set();
    let folder = null;
    let modified = false;

    const grid = document.getElementById('card-grid');
    const status = document.getElementById('status-text');
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');

    // 绑定按钮
    document.getElementById('btn-open').onclick = openFolder;
    document.getElementById('btn-all').onclick = () => { allData.forEach(d => selectedIds.add(d.id)); render(); };
    document.getElementById('btn-none').onclick = () => {
        let current = Array.from(selectedIds);
        selectedIds.clear();
        allData.forEach(d => { if(!current.includes(d.id)) selectedIds.add(d.id); });
        render();
    };
    document.getElementById('btn-del').onclick = () => {
        if (!selectedIds.size) return;
        if (confirm(`确定删除选中的 ${selectedIds.size} 项？`)) {
            allData = allData.filter(d => !selectedIds.has(d.id));
            selectedIds.clear();
            modified = true;
            render();
        }
    };
    document.getElementById('btn-save').onclick = async () => {
        try {
            const handle = await folder.getFileHandle('cave.json', { create: true });
            const w = await handle.createWritable();
            await w.write(JSON.stringify(allData, null, 2));
            await w.close();
            modified = false;
            updateUI();
            alert('保存成功！');
        } catch (e) { alert('保存失败，请检查权限'); }
    };

    // 查看大图逻辑
    lb.onclick = () => { lb.style.display = 'none'; };
    window.onkeydown = (e) => { if(e.key === 'Escape') lb.style.display = 'none'; };

    async function openFolder() {
        try {
            folder = await window.showDirectoryPicker();
            if (await folder.requestPermission({ mode: 'readwrite' }) !== 'granted') return;
            
            grid.innerHTML = '读取中...';
            imgMap.forEach(url => URL.revokeObjectURL(url));
            imgMap.clear();
            selectedIds.clear();

            const jsonHandle = await folder.getFileHandle('cave.json');
            allData = JSON.parse(await (await jsonHandle.getFile()).text());

            for await (const entry of folder.values()) {
                if (entry.kind === 'file' && entry.name.match(/\.(jpg|jpeg|png|webp|gif)$/i)) {
                    imgMap.set(entry.name, URL.createObjectURL(await entry.getFile()));
                }
            }
            modified = false;
            render();
        } catch (e) { console.error(e); status.innerText = '读取失败'; }
    }

function render() {
    // 新增：创建倒序副本用于显示
    const displayData = [...allData].reverse();
    
    grid.innerHTML = '';
    const frag = document.createDocumentFragment();
    
    // 修改：使用倒序数据遍历
    displayData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card' + (selectedIds.has(item.id) ? ' selected' : '');
        
        // Header: 点击进行选择
        const head = document.createElement('div');
        head.className = 'card-header';
        head.innerHTML = `ID: ${item.id} | ${item.userName}<br>${new Date(item.time).toLocaleString()}`;
        head.onclick = (e) => {
            if (selectedIds.has(item.id)) selectedIds.delete(item.id);
            else selectedIds.add(item.id);
            render(); 
        };

        const content = document.createElement('div');
        content.className = 'card-content';
        content.innerHTML = renderElements(item.elements);
        
        // 图片点击大图逻辑
        content.querySelectorAll('img').forEach(img => {
            img.onclick = (e) => {
                e.stopPropagation();
                lbImg.src = img.src;
                lb.style.display = 'flex';
            };
        });

        card.append(head, content);
        frag.appendChild(card);
    });
    grid.appendChild(frag);
    updateUI();
}

    function renderElements(elements) {
        if (!elements) return '';
        return elements.map(el => {
            if (el.type === 'image') return `<img src="${imgMap.get(el.file) || ''}" loading="lazy">`;
            if (el.type === 'text') return `<div class="text-node">${esc(el.content)}</div>`;
            if (el.type === 'forward') {
                return `<div class="forward-box">${(el.content||[]).map(f => `<b>${esc(f.userName)}:</b><br>${renderElements(f.elements)}`).join('')}</div>`;
            }
            return '';
        }).join('');
    }

    function updateUI() {
        status.innerText = folder ? `共 ${allData.length} 条 | 已选 ${selectedIds.size} 条` : '未载入';
        document.getElementById('btn-all').disabled = !allData.length;
        document.getElementById('btn-none').disabled = !allData.length;
        document.getElementById('btn-del').disabled = !selectedIds.size;
        document.getElementById('btn-save').disabled = !modified;
    }

    function esc(s) {
        if(!s) return '';
        return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
</script>
</body>
</html>
